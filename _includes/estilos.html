  <style>
    :root {
      --tierra: #C4622D;
      --sol: #F2A73B;
      --verde: #3A7D44;
      --crema: #FDF6EC;
      --dark: #1A1208;
      --warm-gray: #7C6B55;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--crema);
      color: var(--dark);
      overflow-x: clip;
    }

    .wrap { max-width: 1060px; margin: 0 auto; padding: 0 28px; }

    /* ── HERO ── */
    .page-hero {
      background: linear-gradient(160deg, #241708 0%, #3A2410 100%);
      color: #fff;
      padding: 120px 0 64px;
      text-align: center;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sol);
      margin-bottom: 12px;
    }

    .page-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4.6vw, 3rem);
      line-height: 1.16;
      max-width: 20ch;
      margin: 0 auto 18px;
    }

    .page-hero h1 em { font-style: italic; color: var(--sol); }

    .page-hero p {
      font-size: 1.04rem;
      line-height: 1.75;
      max-width: 54ch;
      margin: 0 auto;
      color: rgba(255,255,255,0.86);
    }

    /* ── AVISO DE MAQUETA ── */
    .draft-note {
      background: #FFF4DC;
      border: 1px dashed #E0B45F;
      border-radius: 14px;
      padding: 16px 22px;
      margin: 40px 0 8px;
      font-size: 0.88rem;
      line-height: 1.65;
      color: #7A5A1E;
    }

    .draft-note strong { color: #5B420F; }

    /* ── ENTRADAS ── */
    .posts { padding: 32px 0 80px; }

    article.post {
      background: #fff;
      border: 1px solid #EFE0CB;
      border-radius: 16px;
      padding: 30px 34px;
      margin-bottom: 22px;
    }

    .post-meta {
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--warm-gray);
      margin-bottom: 10px;
    }

    .post h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.35rem, 2.6vw, 1.8rem);
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .post h2 em { font-style: italic; color: var(--tierra); }

    .post p {
      font-size: 0.99rem;
      line-height: 1.78;
      color: var(--warm-gray);
      margin-bottom: 12px;
      max-width: 72ch;
    }

    .post p:last-of-type { margin-bottom: 18px; }

    .post-more {
      display: inline-block;
      color: var(--tierra);
      font-weight: 700;
      font-size: 0.93rem;
      text-decoration: none;
      border-bottom: 2px solid rgba(196,98,45,0.28);
      padding-bottom: 2px;
    }

    .post-more:hover { border-bottom-color: var(--tierra); }

    /* ── DOS COLUMNAS ──
       Escritorio: las entradas a la izquierda, la tarjeta de apadrinar
       en una columna propia a la derecha. No tapa nada.
       Teléfono: una columna y la tarjeta vuelve a ser barra flotante. */
    .blog-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 48px;
      align-items: start;
      padding-bottom: 20px;
    }

    .blog-aside {
      position: sticky;
      top: 28px;
      z-index: 20;
      margin-top: 32px;
    }

    .donate-bar-inner {
      background: #fff;
      border: 1px solid #E4CEAC;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(26, 18, 8, 0.07);
      padding: 26px 24px;
      display: grid;
      gap: 16px;
      text-align: center;
    }

    .blog-aside p {
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--warm-gray);
      margin: 0;
    }

    .blog-aside .amount {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      color: var(--tierra);
      line-height: 1;
    }

    .blog-aside .amount span {
      font-family: 'Nunito', sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--warm-gray);
      display: block;
      margin-top: 6px;
    }

    .btn-primary {
      background: var(--sol);
      color: var(--dark);
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 30px;
      border-radius: 999px;
      text-decoration: none;
      display: block;
      text-align: center;
      white-space: nowrap;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(242,167,59,0.4); }

    footer {
      background: var(--dark);
      color: rgba(255,255,255,0.72);
      text-align: center;
      padding: 44px 28px;
      font-size: 0.86rem;
      line-height: 1.8;
    }

    footer a { color: var(--sol); text-decoration: none; }

    @media (max-width: 900px) {
      .page-hero { padding: 104px 0 52px; }
      nav.site-nav { padding: 12px 16px; }
      .nav-logo { font-size: 0.95rem; }
      .nav-menu { right: 16px; min-width: 150px; padding: 8px 0; }
      .nav-menu a { padding: 12px 20px; font-size: 0.98rem; }

      article.post { padding: 24px 22px; }

      /* Una columna: la tarjeta cae al final y vuelve a flotar abajo. */
      .blog-layout { display: block; padding-bottom: 0; }
      .blog-aside { position: sticky; top: auto; bottom: 12px; margin-top: 32px; }
      .donate-bar-inner {
        grid-template-columns: auto minmax(0, 1fr);
        gap: 16px;
        padding: 14px 18px;
        text-align: left;
        align-items: center;
        box-shadow: 0 12px 34px rgba(26, 18, 8, 0.16);
      }
      .blog-aside p { display: none; }
      .blog-aside .amount { font-size: 1.5rem; }
      .blog-aside .amount span { font-size: 0.66rem; margin-top: 4px; }
      .btn-primary { padding: 13px 20px; font-size: 0.94rem; }
    }

    /* ══ BARRA SUPERIOR ══
       La misma de la portada, para que haya siempre forma de volver. */
    nav.site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.3s, box-shadow 0.3s;
    }

    nav.site-nav.scrolled {
      background: rgba(26,8,0,0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      font-style: italic;
      white-space: nowrap;
    }

    .nav-logo span { color: var(--sol); }

    .nav-burger {
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      width: 46px; height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .nav-burger:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.45); }
    .nav-burger:focus-visible { outline: 2px solid var(--sol); outline-offset: 3px; }

    .nav-burger span {
      display: block;
      width: 22px; height: 2.5px;
      border-radius: 2px;
      background: #fff;
      transition: transform 0.25s, opacity 0.2s;
    }

    .nav-burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .nav-burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .nav-burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    .nav-menu {
      position: absolute;
      top: calc(100% - 4px);
      right: 32px;
      min-width: 172px;
      background: var(--crema);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.32);
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      transform-origin: top right;
      animation: menuIn 0.18s ease-out;
    }

    .nav-menu[hidden] { display: none; }

    .nav-menu a {
      color: var(--dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.02rem;
      padding: 13px 28px;
      text-align: right;
      transition: background 0.15s, color 0.15s;
    }

    .nav-menu a:hover { background: rgba(196,98,45,0.09); color: var(--tierra); }

    /* La página en la que ya estás: se muestra, pero apagada. */
    .nav-menu a[aria-current="page"] {
      color: var(--warm-gray);
      pointer-events: none;
    }

    @keyframes menuIn {
      from { opacity: 0; transform: scale(0.95) translateY(-6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
<style>
    /* ══ PÁGINA DE UNA ENTRADA ══ */
    .post-hero { text-align: left; }
    .post-hero .wrap { max-width: 1060px; }

    .post-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      line-height: 1.18;
      margin: 0 0 16px;
      max-width: 22ch;
    }

    .post-hero h1 em { font-style: italic; color: var(--sol); }

    .post-hero .post-date {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      /* .page-hero p centra con margin auto; aquí va a la izquierda,
         alineado con el título. */
      margin: 0 0 14px;
      max-width: none;
      line-height: 1.5;
    }

    .post-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin: 0 0 32px;
      background: #F3EDE4;
    }

    .post-body { max-width: 68ch; }

    .post-body p,
    .post-body li {
      font-size: 1.02rem;
      line-height: 1.8;
      color: var(--warm-gray);
      margin-bottom: 18px;
    }

    .post-body h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      line-height: 1.3;
      color: var(--dark);
      margin: 34px 0 14px;
    }

    .post-body h3 {
      font-size: 1.1rem;
      color: var(--dark);
      margin: 26px 0 10px;
    }

    .post-body strong { color: var(--dark); }
    .post-body a { color: var(--tierra); font-weight: 600; }

    .post-body img {
      width: 100%;
      border-radius: 14px;
      display: block;
      margin: 26px 0;
    }

    .post-body blockquote {
      border-left: 3px solid var(--sol);
      padding-left: 16px;
      margin: 24px 0;
      font-style: italic;
      color: var(--dark);
    }

    .post-body ul, .post-body ol { margin: 0 0 18px 22px; }

    /* Vídeo de YouTube: se adapta al ancho */
    .post-body .video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 14px;
      overflow: hidden;
      margin: 26px 0;
      background: #241708;
    }

    .post-body .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .post-back {
      display: inline-block;
      margin-top: 36px;
      color: var(--tierra);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .post-back:hover { text-decoration: underline; }

    /* Imagen en la lista de entradas */
    .post-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin: 0 0 20px;
      background: #F3EDE4;
    }

    @media (max-width: 900px) {
      .post-cover { border-radius: 14px; margin-bottom: 24px; }
      .post-body p, .post-body li { font-size: 0.99rem; }
    }
</style>
